<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerLens - 求职 Agent 工作台</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --ink: #172033;
            --muted: #657386;
            --line: #d9e2ee;
            --teal: #0f766e;
            --teal-soft: #e6f5f2;
            --blue: #2563eb;
            --blue-soft: #eaf1ff;
            --amber: #a16207;
            --amber-soft: #fff5db;
            --danger: #dc2626;
            --shadow: 0 18px 48px rgba(20, 35, 60, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--bg);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }
        button, input, textarea { font: inherit; }
        button { border: 0; cursor: pointer; }
        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
        }
        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--line);
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .mark {
            width: 42px; height: 42px;
            border-radius: 12px;
            display: grid; place-items: center;
            color: white; font-weight: 800;
            background: linear-gradient(135deg, var(--teal), var(--blue));
        }
        .brand-title { font-size: 18px; font-weight: 750; }
        .brand-subtitle, .section-label, .muted, .meta { color: var(--muted); }
        .brand-subtitle, .section-label, .meta { font-size: 12px; }
        .primary {
            width: 100%; min-height: 42px;
            border-radius: 10px;
            color: white; font-weight: 700;
            background: linear-gradient(135deg, var(--teal), var(--blue));
        }
        .section-label {
            margin-bottom: 10px;
            font-weight: 750; letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .nav-list, .session-list, .material-list, .quick-list { display: grid; gap: 8px; }
        .nav-btn, .session, .material, .quick, .card, .status-card {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 10px;
        }
        .nav-btn {
            min-height: 40px; padding: 0 14px;
            text-align: left; color: var(--muted);
        }
        .nav-btn.active {
            color: #075e56;
            background: var(--teal-soft);
            border-color: #acd8d0;
            font-weight: 700;
        }
        .session { padding: 12px; }
        .session.active { background: #f7fafc; }
        .content {
            min-width: 0;
            display: grid;
            grid-template-rows: 78px minmax(0, 1fr);
        }
        .topbar {
            background: rgba(255,255,255,0.82);
            border-bottom: 1px solid var(--line);
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar h1 { margin: 3px 0 0; font-size: 24px; line-height: 1.2; }
        .badges { display: flex; gap: 8px; align-items: center; }
        .badge {
            min-height: 30px;
            border-radius: 999px;
            padding: 7px 12px;
            border: 1px solid #c9d9ff;
            color: #1d4ed8;
            background: var(--blue-soft);
            font-size: 12px; font-weight: 650;
        }
        .workspace {
            padding: 18px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 330px;
            gap: 18px; min-height: 0;
        }
        .panel {
            min-width: 0; min-height: 0;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .main-panel { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
        .toolbar { padding: 16px; border-bottom: 1px solid var(--line); }
        .mode-row, .stats-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .mode-chip {
            min-height: 34px;
            border-radius: 999px;
            padding: 0 14px;
            border: 1px solid var(--line);
            color: var(--muted);
            background: white;
            font-size: 13px;
        }
        .mode-chip.active {
            color: #075e56;
            background: var(--teal-soft);
            border-color: #acd8d0;
            font-weight: 700;
        }
        .quick-list { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 12px; }
        .quick {
            padding: 11px 12px;
            color: #39465a;
            text-align: left;
            font-size: 13px;
        }
        .stage { padding: 20px; overflow: auto; }
        .message { display: flex; gap: 12px; margin-bottom: 16px; }
        .message.user { justify-content: flex-end; }
        .avatar {
            width: 34px; height: 34px;
            border-radius: 10px;
            display: grid; place-items: center;
            flex: 0 0 auto;
            font-size: 12px; font-weight: 800;
        }
        .avatar.ai { color: #075e56; background: var(--teal-soft); }
        .avatar.user { color: #854d0e; background: var(--amber-soft); }
        .bubble {
            max-width: 760px;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            white-space: pre-wrap;
            background: white;
        }
        .message.user .bubble {
            color: white;
            border-color: transparent;
            background: linear-gradient(135deg, var(--teal), var(--blue));
        }
        .composer { border-top: 1px solid var(--line); padding: 14px 16px; }
        .composer-row { display: flex; align-items: flex-end; gap: 10px; }
        textarea, input {
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: none;
            background: white;
        }
        textarea {
            min-height: 54px; resize: none;
            flex: 1; padding: 12px 14px;
            font-size: 14px;
        }
        textarea:focus, input:focus { border-color: var(--teal); }
        .send {
            min-width: 92px; min-height: 54px;
            border-radius: 10px;
            color: white; background: var(--teal);
            font-weight: 750;
        }
        .side-panel { padding: 18px; overflow: auto; }
        .side-title { margin: 0 0 12px; font-size: 17px; }
        .material {
            padding: 12px;
            display: flex; gap: 10px;
        }
        .filetype {
            width: 38px; height: 38px;
            border-radius: 10px;
            display: grid; place-items: center;
            flex: 0 0 auto;
            color: #075e56;
            background: var(--teal-soft);
            font-size: 12px; font-weight: 800;
        }
        .material strong, .session strong { display: block; font-size: 14px; }
        .todo { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
        .todo li {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            background: #fbfcfe;
        }
        .upload-zone {
            min-height: 220px;
            border: 1px dashed #9fb3c8;
            border-radius: 14px;
            background: linear-gradient(180deg, white, #f8fbfd);
            display: grid; place-items: center;
            text-align: center; padding: 22px;
        }
        .upload-zone h2, .empty h2 { margin: 0 0 8px; font-size: 20px; }
        .upload-actions { margin-top: 18px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .secondary {
            min-height: 40px;
            border-radius: 10px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center; justify-content: center;
            color: var(--teal);
            border: 1px solid #acd8d0;
            background: var(--teal-soft);
            font-weight: 700;
        }
        .link-btn { color: var(--teal); background: transparent; font-weight: 700; }
        .stats-grid { margin-top: 16px; }
        .status-card { flex: 1 1 180px; padding: 14px; }
        .status-card strong { display: block; margin-top: 4px; }
        .login-screen {
            min-height: 100vh;
            padding: 24px;
            background: linear-gradient(135deg, #eef7f5, #f4f7fb 48%, #eef3ff);
            display: grid; place-items: center;
        }
        .login-card {
            width: 430px;
            max-width: calc(100vw - 32px);
            border: 1px solid var(--line);
            border-radius: 16px;
            background: white;
            box-shadow: var(--shadow);
            padding: 32px;
        }
        .login-card h1 { margin: 22px 0 8px; font-size: 26px; }
        .field { display: grid; gap: 7px; margin-top: 14px; }
        .field label { font-size: 13px; font-weight: 700; color: var(--muted); }
        .field input { min-height: 44px; padding: 0 12px; }
        .login-actions { display: grid; gap: 10px; margin-top: 20px; }
        .hidden { display: none !important; }
        .agent-meta { font-size: 11px; color: var(--muted); margin: 2px 0; }
        .reasoning-panel {
            margin-bottom: 10px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #f8fafc;
            overflow: hidden;
        }
        .reasoning-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            text-align: left;
        }
        .reasoning-toggle:hover { background: var(--teal-soft); }
        .reasoning-toggle .arrow {
            display: inline-block;
            transition: transform 0.15s;
            font-size: 10px;
            color: var(--muted);
        }
        .reasoning-toggle .arrow.open { transform: rotate(90deg); }
        .reasoning-body {
            border-top: 1px solid var(--line);
            padding: 10px 14px 14px;
            font-size: 12px;
            color: var(--muted);
            display: grid;
            gap: 8px;
        }
        .reasoning-body.hidden { display: none; }
        .r-line { display: flex; gap: 8px; align-items: flex-start; line-height: 1.6; }
        .r-dot {
            flex: 0 0 auto;
            width: 6px; height: 6px;
            border-radius: 50%;
            margin-top: 6px;
            background: #b4c2d4;
        }
        .r-line.plan { color: #39465a; }
        .r-line.plan .r-dot { background: var(--blue); }
        .r-tool {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: white;
            padding: 8px 10px;
        }
        .r-tool strong { display: block; font-size: 12px; color: #075e56; margin-bottom: 3px; }
        .r-tool .r-tool-content { color: var(--muted); white-space: pre-wrap; word-break: break-word; }
        .r-reflection {
            border-left: 3px solid var(--amber);
            background: var(--amber-soft);
            padding: 8px 10px;
            border-radius: 0 8px 8px 0;
            color: var(--amber);
            line-height: 1.6;
        }
        .r-memory { color: var(--teal); }
        @media (max-width: 1040px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .workspace { grid-template-columns: 1fr; }
            .side-panel { display: none; }
            .quick-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <section id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="brand">
                <div class="mark">CL</div>
                <div><div class="brand-title">CareerLens</div><div class="brand-subtitle">求职资料工作台</div></div>
            </div>
            <h1 id="authTitle">进入工作台</h1>
            <p class="muted" id="authText">登录后使用 JD 匹配和简历诊断功能。</p>
            <div class="field">
                <label for="usernameInput">用户名</label>
                <input id="usernameInput" value="candidate01" autocomplete="username">
            </div>
            <div class="field">
                <label for="passwordInput">密码</label>
                <input id="passwordInput" type="password" value="career123" autocomplete="current-password">
            </div>
            <div class="login-actions">
                <button class="primary" id="authButton">登录</button>
                <button class="link-btn" id="toggleAuth">没有账号，先注册</button>
            </div>
        </div>
    </section>

    <div id="appShell" class="app hidden">
        <aside class="sidebar">
            <div class="brand">
                <div class="mark">CL</div>
                <div><div class="brand-title">CareerLens</div><div class="brand-subtitle">求职资料工作台</div></div>
            </div>
            <button class="primary" data-action="new-chat">新建分析</button>
            <section>
                <div class="section-label">分析模式</div>
                <div class="nav-list" id="sideModes"></div>
            </section>
            <section>
                <div class="section-label">历史会话</div>
                <div class="session-list" id="sessionList">
                    <div class="session"><strong>暂无会话</strong><span class="meta">新建一个开始分析</span></div>
                </div>
            </section>
        </aside>

        <main class="content">
            <header class="topbar">
                <div>
                    <div class="muted">资料上传 / 岗位匹配 / 简历诊断</div>
                    <h1>求职 Agent 工作台</h1>
                </div>
                <div class="badges">
                    <span class="badge" id="fileBadge">0 份资料</span>
                    <span class="badge" id="modeBadge">岗位匹配</span>
                </div>
            </header>

            <section class="workspace">
                <section class="panel main-panel">
                    <div class="toolbar">
                        <div class="mode-row" id="topModes"></div>
                        <div class="quick-list" id="quickPrompts"></div>
                    </div>
                    <div class="stage" id="stage"></div>
                    <div class="composer" id="composer">
                        <div class="composer-row">
                            <textarea id="inputBox" placeholder="输入你的岗位、简历或面试问题..."></textarea>
                            <button class="send" id="sendButton">发送</button>
                        </div>
                    </div>
                </section>

                <aside class="panel side-panel">
                    <h2 class="side-title">本轮材料</h2>
                    <div class="material-list" id="materialList">
                        <p class="meta">暂无已上传资料</p>
                    </div>
                    <h2 class="side-title" style="margin-top: 22px;">下一步</h2>
                    <ul class="todo">
                        <li>上传目标公司的真实岗位 JD</li>
                        <li>上传个人简历或项目素材</li>
                        <li>使用岗位匹配分析差距</li>
                        <li>根据诊断建议优化简历表达</li>
                    </ul>
                </aside>
            </section>
        </main>
    </div>

    <script>
        const API = "";
        const state = {
            loggedIn: false,
            authMode: "login",
            mode: "match",
            currentSessionUuid: "",
            sessions: [],
            files: [],
            sending: false
        };

        const modes = [
            ["upload", "资料上传"],
            ["match", "岗位匹配"],
            ["resume", "简历诊断"]
        ];

        const prompts = {
            upload: [],
            match: [
                "请根据知识库分析大模型算法岗 JD 的核心要求，并按重要性排序。",
                "请对比我的简历和目标岗位，列出最需要补强的 5 个能力点。"
            ],
            resume: [
                "请检查项目经历是否突出算法问题、检索策略和量化结果。",
                "请找出我简历中表达空泛、缺少量化结果的地方，并给出优化建议。"
            ]
        };

        const $ = (id) => document.getElementById(id);

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
        }

        async function api(method, path, body) {
            const opts = { method, headers: { "Content-Type": "application/json" }, credentials: "include" };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(API + path, opts);
            if (!res.ok) {
                const err = await res.json().catch(() => ({ detail: res.statusText }));
                throw new Error(err.detail || "请求失败");
            }
            return res;
        }

        function setLoggedIn(value) {
            state.loggedIn = value;
            $("loginScreen").classList.toggle("hidden", value);
            $("appShell").classList.toggle("hidden", !value);
            if (value) { refreshSessions(); render(); }
        }

        async function refreshSessions() {
            try {
                const res = await (await api("GET", "/sessions")).json();
                state.sessions = res.data || [];
                renderSessions();
            } catch (e) { console.error("获取会话列表失败:", e); }
        }

        function renderModes(targetId, className) {
            $(targetId).innerHTML = modes.map(([key, label]) =>
                `<button class="${className} ${state.mode === key ? "active" : ""}" data-mode="${key}">${label}</button>`
            ).join("");
        }

        function renderMaterials() {
            $("fileBadge").textContent = `${state.files.length} 份资料`;
            $("materialList").innerHTML = state.files.length === 0
                ? '<p class="meta">暂无已上传资料</p>'
                : state.files.map(([type, name, desc]) => `
                    <div class="material">
                        <div class="filetype">${type}</div>
                        <div><strong>${escapeHtml(name)}</strong><span class="meta">${escapeHtml(desc)}</span></div>
                    </div>
                `).join("");
        }

        function renderSessions() {
            if (state.sessions.length === 0) {
                $("sessionList").innerHTML = '<div class="session"><strong>暂无会话</strong><span class="meta">新建一个开始分析</span></div>';
                return;
            }
            $("sessionList").innerHTML = state.sessions.map(s => {
                const isActive = s.session_id === state.currentSessionUuid;
                return `<div class="session${isActive ? " active" : ""}" data-sid="${s.session_id}">
                    <strong>${escapeHtml(s.title)}</strong><span class="meta">${s.update_time || ""}</span>
                </div>`;
            }).join("");
        }

        function renderUpload() {
            $("composer").classList.add("hidden");
            $("quickPrompts").innerHTML = "";
            $("stage").innerHTML = `
                <section class="upload-zone">
                    <div>
                        <div class="mark" style="margin:0 auto 14px;width:54px;height:54px;">+</div>
                        <h2>上传求职资料</h2>
                        <p class="muted">支持岗位 JD、个人简历、项目说明，格式支持 txt、md、pdf。</p>
                        <div class="upload-actions">
                            <label class="secondary">
                                <input id="fileInput" type="file" accept=".txt,.md,.pdf" style="display:none">
                                选择文件
                            </label>
                            <button class="primary" style="width:auto;padding:0 18px" id="uploadButton">写入知识库</button>
                        </div>
                    </div>
                </section>
                <div class="stats-grid">
                    <div class="status-card"><span class="meta">已选文件</span><strong id="selectedFile">未选择</strong></div>
                    <div class="status-card"><span class="meta">建议材料</span><strong>简历 + JD + 项目说明</strong></div>
                    <div class="status-card"><span class="meta">处理状态</span><strong id="uploadStatus">等待上传</strong></div>
                </div>
            `;
            $("fileInput").addEventListener("change", (event) => {
                const file = event.target.files[0];
                if (!file) return;
                $("selectedFile").textContent = file.name;
                $("uploadStatus").textContent = "已选择，等待写入";
            });
            $("uploadButton").addEventListener("click", async () => {
                const input = $("fileInput");
                const file = input.files[0];
                if (!file) { alert("请先选择文件"); return; }
                $("uploadStatus").textContent = "正在写入...";
                try {
                    const form = new FormData();
                    form.append("file", file);
                    const res = await fetch(API + "/knowledge/upload", { method: "POST", body: form, credentials: "include" });
                    const data = await res.json();
                    if (data.status === "success") {
                        $("uploadStatus").textContent = data.message;
                        state.files.unshift([file.name.split(".").pop().toUpperCase().slice(0, 3), file.name, "已入库"]);
                        renderMaterials();
                    } else {
                        $("uploadStatus").textContent = "上传失败";
                    }
                } catch (e) {
                    $("uploadStatus").textContent = "上传失败: " + e.message;
                }
            });
        }

        function renderChat() {
            $("composer").classList.remove("hidden");
            $("quickPrompts").innerHTML = prompts[state.mode].map(item =>
                `<button class="quick" data-prompt="${escapeHtml(item)}">${escapeHtml(item)}</button>`
            ).join("");
            $("inputBox").placeholder = state.mode === "resume"
                ? "粘贴简历内容或输入简历诊断问题..."
                : "输入岗位 JD、简历片段或分析问题...";
            $("stage").innerHTML = '<div class="empty" style="padding:60px;text-align:center"><h2>开始新的分析</h2><p class="muted">选择快捷提问或输入你的问题</p></div>';
        }

        async function loadHistory(uuid) {
            try {
                const res = await (await api("GET", "/chat/" + uuid)).json();
                const messages = res.data || [];
                if (messages.length === 0) {
                    $("stage").innerHTML = '<div class="empty" style="padding:60px;text-align:center"><h2>暂无消息</h2><p class="muted">这是空会话，发送第一条消息开始分析</p></div>';
                    return;
                }
                messages.forEach(m => {
                    appendMessage("user", m.user_input);
                    appendMessage("ai", m.raw_output || "");
                });
                $("stage").scrollTop = $("stage").scrollHeight;
            } catch (e) {
                console.error("加载历史失败:", e);
                $("stage").innerHTML = '<div class="empty" style="padding:60px;text-align:center"><h2>历史加载失败</h2><p class="muted">' + escapeHtml(e.message) + '</p></div>';
            }
        }

        function render() {
            if (!state.loggedIn) return;
            const current = modes.find(([key]) => key === state.mode) || modes[1];
            $("modeBadge").textContent = current[1];
            renderModes("sideModes", "nav-btn");
            renderModes("topModes", "mode-chip");
            renderMaterials();
            renderSessions();
            if (state.mode === "upload") renderUpload();
            else renderChat();
        }

        function appendMessage(role, text) {
            const isUser = role === "user";
            const div = document.createElement("div");
            div.className = `message${isUser ? " user" : ""}`;
            div.innerHTML = isUser
                ? `<div class="bubble">${escapeHtml(text)}</div><div class="avatar user">我</div>`
                : `<div class="avatar ai">CL</div><div class="bubble">${escapeHtml(text)}</div>`;
            $("stage").appendChild(div);
            $("stage").scrollTop = $("stage").scrollHeight;
            return div.querySelector(".bubble");
        }

        function appendThinkingPanel() {
            const wrap = document.createElement("div");
            wrap.className = "message ai";
            wrap.innerHTML = `<div class="avatar ai">CL</div>`;
            const col = document.createElement("div");
            col.style.cssText = "flex:1;min-width:0;";
            wrap.appendChild(col);

            const panel = document.createElement("div");
            panel.className = "reasoning-panel";
            const toggle = document.createElement("button");
            toggle.className = "reasoning-toggle";
            toggle.innerHTML = `<span class="arrow open">▶</span><span>Agent 工作流</span>`;
            const body = document.createElement("div");
            body.className = "reasoning-body";
            panel.appendChild(toggle);
            panel.appendChild(body);
            col.appendChild(panel);

            let open = true;
            toggle.addEventListener("click", () => {
                open = !open;
                body.classList.toggle("hidden", !open);
                toggle.querySelector(".arrow").classList.toggle("open", open);
            });
            $("stage").appendChild(wrap);
            $("stage").scrollTop = $("stage").scrollHeight;
            return {
                body,
                setCollapsed(collapsed) {
                    open = !collapsed;
                    body.classList.toggle("hidden", collapsed);
                    toggle.querySelector(".arrow").classList.toggle("open", !collapsed);
                }
            };
        }

        function renderReasoning(panelBody, evt) {
            const el = document.createElement("div");
            if (evt.type === "plan") {
                el.className = "r-line plan";
                const dot = document.createElement("span");
                dot.className = "r-dot";
                const txt = document.createElement("span");
                txt.textContent = evt.content || "";
                el.appendChild(dot);
                el.appendChild(txt);
            } else if (evt.type === "tool") {
                el.className = "r-tool";
                el.innerHTML = `<strong>${escapeHtml(evt.title || "工具")}</strong><div class="r-tool-content">${escapeHtml(evt.content || "")}</div>`;
            } else if (evt.type === "reflection") {
                el.className = "r-reflection";
                el.textContent = "反思：" + (evt.content || "");
            } else if (evt.type === "memory") {
                el.className = "r-line memory";
                const dot = document.createElement("span");
                dot.className = "r-dot";
                const txt = document.createElement("span");
                txt.textContent = "记忆：" + (evt.content || "");
                el.appendChild(dot);
                el.appendChild(txt);
            } else {
                el.className = "r-line status";
                const dot = document.createElement("span");
                dot.className = "r-dot";
                const txt = document.createElement("span");
                txt.textContent = evt.content || "";
                el.appendChild(dot);
                el.appendChild(txt);
            }
            panelBody.appendChild(el);
            $("stage").scrollTop = $("stage").scrollHeight;
        }

        async function sendMessage() {
            if (state.sending) return;
            const text = $("inputBox").value.trim();
            if (!text) return;

            if (!state.currentSessionUuid) {
                try {
                    const res = await (await api("POST", "/sessions", {})).json();
                    state.currentSessionUuid = res.data.session_id;
                    await refreshSessions();
                } catch (e) {
                    alert("创建会话失败，请先登录");
                    return;
                }
            }

            appendMessage("user", text);
            $("inputBox").value = "";
            state.sending = true;
            $("sendButton").textContent = "...";
            $("sendButton").disabled = true;

            const thinkingCtx = appendThinkingPanel();
            const bubble = appendMessage("ai", "");
            let answerStarted = false;

            function handleSseFrame(rawFrame) {
                let eventName = "message", dataStr = "";
                for (const line of rawFrame.split("\n")) {
                    if (line.startsWith("event:")) eventName = line.slice(6).trim();
                    else if (line.startsWith("data:")) dataStr += line.slice(5).trim();
                }
                if (!dataStr) return;
                let payload;
                try { payload = JSON.parse(dataStr); } catch { return; }

                if (eventName === "reasoning") {
                    renderReasoning(thinkingCtx.body, payload);
                } else if (eventName === "answer") {
                    if (!answerStarted) {
                        answerStarted = true;
                        thinkingCtx.setCollapsed(true);
                    }
                    bubble.textContent += payload.content || "";
                    $("stage").scrollTop = $("stage").scrollHeight;
                }
            }

            try {
                const res = await api("POST", "/chat", {
                    session_uuid: state.currentSessionUuid,
                    input_text: text
                });
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    let idx;
                    while ((idx = buffer.indexOf("\n\n")) >= 0) {
                        const rawFrame = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        if (rawFrame.trim()) handleSseFrame(rawFrame);
                    }
                }
                if (buffer.trim()) handleSseFrame(buffer);
            } catch (e) {
                bubble.textContent = "错误: " + e.message;
            } finally {
                state.sending = false;
                $("sendButton").textContent = "发送";
                $("sendButton").disabled = false;
                refreshSessions();
            }
        }

        function toggleAuth() {
            state.authMode = state.authMode === "login" ? "register" : "login";
            $("authTitle").textContent = state.authMode === "login" ? "进入工作台" : "创建工作台账号";
            $("authText").textContent = state.authMode === "login" ? "登录后使用 JD 匹配和简历诊断功能。" : "注册后即可创建本地求职知识库。";
            $("authButton").textContent = state.authMode === "login" ? "登录" : "注册";
            $("toggleAuth").textContent = state.authMode === "login" ? "没有账号，先注册" : "已有账号，返回登录";
        }

        async function doAuth() {
            const username = $("usernameInput").value.trim();
            const password = $("passwordInput").value.trim();
            if (!username || !password) { alert("请输入用户名和密码"); return; }

            const path = state.authMode === "login" ? "/auth/login" : "/auth/register";
            const params = new URLSearchParams({ username, password });
            try {
                const res = await fetch(API + path + "?" + params, { method: "POST", credentials: "include" });
                const data = await res.json();
                if (!res.ok) { alert(data.detail || "操作失败"); return; }
                if (state.authMode === "register") {
                    alert("注册成功，请登录");
                    toggleAuth();
                } else {
                    setLoggedIn(true);
                }
            } catch (e) {
                alert("网络错误: " + e.message);
            }
        }

        document.addEventListener("click", (event) => {
            const modeBtn = event.target.closest("[data-mode]");
            if (modeBtn) {
                state.mode = modeBtn.dataset.mode;
                render();
            }
            const promptBtn = event.target.closest("[data-prompt]");
            if (promptBtn) {
                $("inputBox").value = promptBtn.dataset.prompt;
            }
            if (event.target.id === "authButton") doAuth();
            if (event.target.id === "toggleAuth") toggleAuth();
            if (event.target.dataset.action === "new-chat") {
                state.currentSessionUuid = "";
                state.mode = "match";
                render();
            }
            const sessionDiv = event.target.closest("[data-sid]");
            if (sessionDiv) {
                state.currentSessionUuid = sessionDiv.dataset.sid;
                state.mode = "match";
                render();
                loadHistory(state.currentSessionUuid);
            }
        });

        $("sendButton").addEventListener("click", sendMessage);
        $("inputBox").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
</html>
